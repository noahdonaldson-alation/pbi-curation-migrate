[project]
name = "pbi-curation-migrate"
version = "0.1.0"
description = "Copy Alation curation from soft-deleted Power BI objects to their re-extracted replacements."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pbi-migrate = "pbi_migrate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pbi_migrate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
